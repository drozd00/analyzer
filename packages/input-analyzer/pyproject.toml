[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "input-analyzer"
version = "1.0.0"
description = "Reproducible analysis of browser form interactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
report = ["matplotlib>=3.10,<4"]
db = ["psycopg[binary]>=3.2,<4"]
full = ["matplotlib>=3.10,<4", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1", "ty>=0.0.1,<1", "check-wheel-contents>=0.6,<1"]

[project.scripts]
input-analyzer = "input_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["input_analyzer"]

[tool.hatch.build.targets.sdist]
include = ["input_analyzer", "scripts", "tests", "fixtures", "examples", "pyproject.toml", "uv.lock", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I"]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a migrated disposable PostgreSQL database"]
