name: Input analyzer

on:
  push:
    paths: ['packages/input-analyzer/**', 'datastore/migrations/**', '.github/workflows/input-analyzer.yml', 'package.json']
  pull_request:
    paths: ['packages/input-analyzer/**', 'datastore/migrations/**', '.github/workflows/input-analyzer.yml', 'package.json']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer-test-only
          POSTGRES_DB: analyzer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U analyzer -d analyzer_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://analyzer:analyzer-test-only@localhost:5432/analyzer_test
    defaults:
      run:
        working-directory: packages/input-analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: packages/input-analyzer/uv.lock
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../datastore/migrations/001_initial.sql
      - run: uv run --frozen pytest
      - run: uv build
      - run: uv run --frozen check-wheel-contents dist/*.whl
      - run: uv run --frozen python scripts/check_distribution.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t input-analyzer-test packages/input-analyzer
      - run: docker run --rm input-analyzer-test --version
      - name: Verify production environment
        run: >-
          docker run --rm --entrypoint python input-analyzer-test -c
          'import importlib.util, os, matplotlib.pyplot, psycopg; assert os.getuid() != 0;
          assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "ty", "check_wheel_contents"))'
